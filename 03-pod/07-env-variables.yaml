apiVersion: v1
kind: Pod
metadata:
  name: env-variables
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
      env:
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG_MODE
          value: "false"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: api-key
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: database-url
        - name: LOG_LEVEL
          value: "info"
        - name: MAX_CONNECTIONS
          value: "100"
        - name: TIMEOUT
          value: "30s"
        - name: FEATURE_FLAG
          value: "enabled"
        - name: SERVICE_PORT
          value: "8080"
        - name: CACHE_ENABLED
          value: "true"
        - name: RETRY_COUNT
          value: "3"
        - name: MAINTENANCE_MODE
          value: "false"